<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lila Travel CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Lila Travel CRM ✈️</h1>

  <button onclick="addClient()">Agregar Cliente</button>

  <div class="board">
    <div class="column">
      <h2>Nuevo</h2>
      <div id="Nuevo" class="dropzone"></div>
    </div>

    <div class="column">
      <h2>Cotizando</h2>
      <div id="Cotizando" class="dropzone"></div>
    </div>

    <div class="column">
      <h2>Reservado</h2>
      <div id="Reservado" class="dropzone"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
